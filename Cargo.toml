[workspace]
members = ["crates/fastlink-gui"]
default-members = [".", "crates/fastlink-gui"]
resolver = "2"

[package]
name = "fastlink"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Experimental state-aware distributed data transport and content-addressed delta transfer"
repository = "https://github.com/ilievi187/FASTLINK"
readme = "README.md"
keywords = ["distributed", "cache", "deduplication", "rpc", "delta"]
categories = ["network-programming", "filesystem"]
publish = false

[dependencies]
blake3 = "1.8"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snow = { version = "0.10.0", default-features = false, features = [
    "use-chacha20poly1305",
    "use-blake2",
    "use-curve25519",
    "use-getrandom",
] }
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
keyring-core = "1.0.1"
zbus-secret-service-keyring-store = { version = "1.0.1", default-features = false, features = ["rt-async-io-crypto-rust"] }

[dev-dependencies]
tempfile = "3"
