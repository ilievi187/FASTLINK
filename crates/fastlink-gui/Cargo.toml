[package]
name = "fastlink-gui"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
description = "FASTLINK Linux desktop shell: local device overview (pre-alpha)"
repository = "https://github.com/ilievi187/FASTLINK"
publish = false

[dependencies]
fastlink = { path = "../.." }
tempfile = "3"
egui = { version = "0.36.2", default-features = false, features = ["default_fonts"] }
# Glow (OpenGL) keeps the dependency tree small; the default wgpu backend is not
# needed for a form-style desktop shell.
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
