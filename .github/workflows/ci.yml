name: Rust CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Build
        run: cargo build --locked --workspace --all-targets
      - name: Test
        run: cargo test --locked --workspace --lib --bins --tests --examples
      - name: Doc tests
        run: cargo test --locked --workspace --doc
      - name: Feature-gated transport integration tests
        run: cargo test --locked -p fastlink --features rpc-v3-transport --test transport_integration --test status_cli
      - name: Doc coherence (M-5)
        if: runner.os == 'Linux'
        run: cargo test --locked -p fastlink --test benchmark_docs
      - name: Transport benchmark smoke test
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Linux'
        run: cargo bench -p fastlink --bench rpc_latency
      - name: Linux GUI-to-CLI inventory contract
        if: runner.os == 'Linux'
        env:
          FASTLINK_BIN: ${{ github.workspace }}/target/debug/fastlink
        run: cargo test --locked -p fastlink-gui --test command_runner actual_fastlink_binary_from_environment_satisfies_parser -- --exact
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Feature-gated transport Clippy
        run: cargo clippy --locked -p fastlink --features rpc-v3-transport --all-targets -- -D warnings
