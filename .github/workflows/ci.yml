name: Rust CI
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Build
        run: cargo build --all-targets
      - name: Test
        run: cargo test --all-targets
      - name: Doc coherence (M-5)
        if: runner.os == 'Linux'
        run: cargo test --all-targets
      - name: Transport benchmark smoke test
        if: runner.os == 'Linux'
        run: cargo bench --bench rpc_latency
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
