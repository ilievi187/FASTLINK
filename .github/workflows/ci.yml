name: Rust CI

permissions:
  contents: write
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: [self-hosted, Linux, X64, nn-ubuntu-ci]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Build
        run: cargo build --all-targets
      - name: Test
        run: cargo test --workspace --lib --bins --tests --examples
      - name: Doc tests
        run: cargo test --workspace --doc
      - name: Feature-gated transport integration tests
        run: cargo test -p fastlink --features rpc-v3-transport --test transport_integration --test status_cli
      - name: Doc coherence (M-5)
        if: runner.os == 'Linux'
        run: cargo test -p fastlink --test benchmark_docs
      - name: Transport benchmark smoke test
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Linux'
        run: cargo bench -p fastlink --bench rpc_latency
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Feature-gated transport Clippy
        run: cargo clippy -p fastlink --features rpc-v3-transport --all-targets -- -D warnings
      - name: Live GUI-to-CLI inventory contract
        if: runner.os == 'Linux'
        env:
          FASTLINK_BIN: ${{ github.workspace }}/target/debug/fastlink
        run: cargo test -p fastlink-gui --test command_runner actual_fastlink_binary_from_environment_satisfies_parser

      - name: Compile release binaries on Ubuntu server
        run: cargo build --workspace --release
      - name: Package Linux command line and desktop shell
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-artifacts/fastlink-linux-x86_64
          install -m 0755 target/release/fastlink build-artifacts/fastlink-linux-x86_64/fastlink
          install -m 0755 target/release/fastlink-gui build-artifacts/fastlink-linux-x86_64/fastlink-gui
          tar -C build-artifacts -czf build-artifacts/FASTLINK-linux-x86_64.tar.gz fastlink-linux-x86_64
          rm -r build-artifacts/fastlink-linux-x86_64
          (cd build-artifacts && sha256sum FASTLINK-linux-x86_64.tar.gz > SHA256SUMS.txt)
      - name: Publish verified binaries as GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: server-${{ github.sha }}
          name: FASTLINK Linux CLI and GUI — Ubuntu server build
          prerelease: true
          generate_release_notes: false
          body: Built on the personal Ubuntu runner from this exact source commit.
          files: build-artifacts/*
          fail_on_unmatched_files: true
